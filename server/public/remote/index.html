<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0a0c11">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SimpleTV">
<link rel="manifest" id="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="icon" href="icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>SimpleTV Remote</title>
<link rel="stylesheet" href="remote.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-back" viewBox="0 0 24 24"><path d="M10 5l-7 7 7 7M3.5 12H21"/></symbol>
  <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></symbol>
  <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></symbol>
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M5 5v14l8-7zM15 5v14M19 5v14"/></symbol>
  <symbol id="i-vdown" viewBox="0 0 24 24"><path d="M3 9.5h3.5L11 5.5v13l-4.5-4H3z"/><path d="M15 12h6"/></symbol>
  <symbol id="i-vup" viewBox="0 0 24 24"><path d="M3 9.5h3.5L11 5.5v13l-4.5-4H3z"/><path d="M15 12h6M18 9v6"/></symbol>
  <symbol id="i-mute" viewBox="0 0 24 24"><path d="M3 9.5h3.5L11 5.5v13l-4.5-4H3z"/><path d="M15.5 9.5l5 5M20.5 9.5l-5 5"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21"/></symbol>
  <symbol id="i-chev" viewBox="0 0 24 24"><path d="M6 15l6-6 6 6"/></symbol>
</svg>

<div id="pair" class="screen" hidden>
  <div class="pair-card">
    <div class="logo"></div>
    <h1>Pair with your TV</h1>
    <p>Enter the six-digit code shown on the TV, under <b>Settings → Phone remote</b>.</p>
    <input id="pair-code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="000000">
    <label class="lbl" for="pair-name">Name for this phone</label>
    <input id="pair-name" maxlength="40" autocomplete="off">
    <button id="pair-go" class="primary">Pair</button>
    <p id="pair-err" class="err" hidden></p>
  </div>
</div>

<div id="remote" class="screen" hidden>
  <header>
    <div class="tv"><span id="dot" class="dot"></span><span id="tv-name">SimpleTV</span></div>
    <div id="showing" class="showing"></div>
  </header>

  <div class="a2hs" id="a2hs" hidden>
    <div><b>Add to Home Screen</b><span id="a2hs-how"></span></div>
    <button id="a2hs-x" aria-label="Dismiss">✕</button>
  </div>

  <nav class="seg" id="seg">
    <button data-mode="buttons" class="on">Buttons</button>
    <button data-mode="touch">Touchpad<i id="touch-hint" hidden></i></button>
    <button data-mode="keys">Keyboard</button>
  </nav>

  <section class="mode" id="mode-buttons">
    <div class="dpad">
      <button class="dir up" data-key="up" aria-label="Up"><svg><use href="#i-chev"/></svg></button>
      <button class="dir right" data-key="right" aria-label="Right"><svg><use href="#i-chev"/></svg></button>
      <button class="dir down" data-key="down" aria-label="Down"><svg><use href="#i-chev"/></svg></button>
      <button class="dir left" data-key="left" aria-label="Left"><svg><use href="#i-chev"/></svg></button>
      <button class="ok" id="ok" aria-label="OK">OK</button>
    </div>
    <p class="hint">Hold OK for options</p>
  </section>

  <section class="mode" id="mode-touch" hidden>
    <div class="pad" id="pad"><span>Slide to move the pointer<br>Tap to click · Two fingers to scroll</span></div>
  </section>

  <section class="mode" id="mode-keys" hidden>
    <input id="kb" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Type here…" enterkeyhint="go">
    <div class="kb-row">
      <button data-key="backspace">Delete</button>
      <button data-key="enter" class="primary">Enter</button>
    </div>
    <p class="hint">What you type goes to the TV as you type it.</p>
  </section>

  <div class="buttons">
    <button data-act="back" aria-label="Back"><svg><use href="#i-back"/></svg><span>Back</span></button>
    <button data-act="home" aria-label="Home"><svg><use href="#i-home"/></svg><span>Home</span></button>
    <button data-key="menu" aria-label="Options"><svg><use href="#i-menu"/></svg><span>Options</span></button>
    <button data-act="search" aria-label="Search"><svg><use href="#i-search"/></svg><span>Search</span></button>
  </div>
  <div class="buttons media">
    <button data-act="volume" data-step="-1" aria-label="Volume down"><svg><use href="#i-vdown"/></svg></button>
    <button data-act="mute" aria-label="Mute"><svg><use href="#i-mute"/></svg></button>
    <button data-act="playpause" aria-label="Play or pause" class="wide"><svg><use href="#i-play"/></svg></button>
    <button data-act="volume" data-step="1" aria-label="Volume up"><svg><use href="#i-vup"/></svg></button>
  </div>
  <div class="vol" id="vol"><i id="vol-fill"></i></div>
</div>

<script src="remote.js" type="module"></script>
</body>
</html>
