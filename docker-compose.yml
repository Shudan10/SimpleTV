# SimpleTV: a TV home screen for a computer plugged into a TV.
#
# Settings come from .env, which install.sh writes. Three services:
#   server  the home screen, phone remote and controllers; always running
#   tv      TV mode: the screen itself, started at boot (profile "tv")
#   window  window mode: the screen as a full-screen window on a desktop,
#           opened with `simpletv open` or the SimpleTV app icon (profile "window")
#
# Everything uses the host's network: the browser and the server talk over
# 127.0.0.1, and the phone reaches the server on this machine's own address.
name: simpletv

x-display: &display
  build: ./display
  image: simpletv/display:1
  network_mode: host
  shm_size: 1gb
  logging:
    driver: json-file
    options: { max-size: 5m, max-file: "2" }

services:
  server:
    build: ./server
    image: simpletv/server:1
    container_name: simpletv-server
    network_mode: host
    restart: unless-stopped
    environment:
      PORT: ${SIMPLETV_PORT:-8480}
      SIMPLETV_MODE: ${SIMPLETV_MODE:-window}
      SIMPLETV_REPO: ${SIMPLETV_REPO:-Shudan10/SimpleTV}
      SIMPLETV_REF: ${SIMPLETV_REF:-main}
      STACK_HOST: ${STACK_HOST:-}
      HOST_HOME: ${HOST_HOME:-}
      HOST_UID: ${HOST_UID:-1000}
      HOST_GID: ${HOST_GID:-1000}
      CDP_PORT: ${SIMPLETV_CDP_PORT:-9333}
      PULSE_SERVER: unix:/run/simpletv-audio/native
      TZ: ${TZ:-UTC}
    volumes:
      - data:/data
      - ${AUDIO_SOURCE:-audio}:/run/simpletv-audio
      - /dev/input:/dev/input:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - .:/stack
      # The host's system bus, for Power off and Restart on the TV.
      - /run/dbus/system_bus_socket:/run/dbus/system_bus_socket
      # Where the window listens for pointer moves from the phone's touchpad.
      - input:/run/simpletv-input
    # Docker's default AppArmor profile refuses the system bus, which Power off
    # and Restart go through. This server already holds the Docker socket,
    # which is root on the host, so lifting the profile grants nothing new.
    security_opt:
      - apparmor:unconfined
    # Read access to input devices (major 13), for game controllers.
    device_cgroup_rules:
      - "c 13:* r"
    logging:
      driver: json-file
      options: { max-size: 5m, max-file: "2" }

  tv:
    <<: *display
    container_name: simpletv-tv
    profiles: ["tv"]
    restart: unless-stopped
    # Taking over the screen means DRM master, a virtual terminal and every
    # input device, which is what privileged is for. The browser inside still
    # runs as an ordinary user with its sandbox on.
    privileged: true
    environment:
      SIMPLETV_MODE: tv
      SIMPLETV_URL: http://127.0.0.1:${SIMPLETV_PORT:-8480}/tv/
      CDP_PORT: ${SIMPLETV_CDP_PORT:-9333}
      HOST_UID: ${HOST_UID:-1000}
      HOST_GID: ${HOST_GID:-1000}
      TZ: ${TZ:-UTC}
    volumes:
      - browser:/browser
      - ${AUDIO_SOURCE:-audio}:/run/simpletv-xdg/pulse
      - /dev:/dev
      - /run/udev:/run/udev:ro
      - input:/run/simpletv-input

  window:
    <<: *display
    container_name: simpletv-window
    profiles: ["window"]
    restart: "no"
    # SYS_ADMIN is what the browser's sandbox needs to set itself up in a container.
    cap_add:
      - SYS_ADMIN
    # Docker's AppArmor profile refuses the desktop's session bus, which is how
    # the browser keeps the desktop from locking while SimpleTV is open. This
    # window already has the desktop's X display, so it grants nothing new.
    security_opt:
      - apparmor:unconfined
    devices:
      - /dev/dri:/dev/dri
    environment:
      SIMPLETV_MODE: window
      SIMPLETV_URL: http://127.0.0.1:${SIMPLETV_PORT:-8480}/tv/
      SIMPLETV_SCREEN: ${SIMPLETV_SCREEN:-auto}
      CDP_PORT: ${SIMPLETV_CDP_PORT:-9333}
      DISPLAY: ${HOST_DISPLAY:-:0}
      HOST_UID: ${HOST_UID:-1000}
      HOST_GID: ${HOST_GID:-1000}
      TZ: ${TZ:-UTC}
    volumes:
      - browser:/browser
      - ${AUDIO_SOURCE:-audio}:/run/simpletv-xdg/pulse
      - /tmp/.X11-unix:/tmp/.X11-unix:ro
      # The desktop session's bus: how the browser asks the desktop not to
      # lock or blank the screen while SimpleTV is open.
      - ${HOST_RUNTIME_DIR:-/run/user/1000}/bus:/run/simpletv-session-bus
      - input:/run/simpletv-input

volumes:
  data:
    name: simpletv-data
  browser:
    name: simpletv-browser
  audio:
    name: simpletv-audio
  input:
    name: simpletv-input
